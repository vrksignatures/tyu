name: Build Auriga debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Find and unpack project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""
          for candidate in Auriga_Source_Updated.zip Auriga_Source_Code.zip; do
            if [[ -f "$candidate" ]]; then
              ZIP="$candidate"
              break
            fi
          done

          if [[ -z "$ZIP" ]]; then
            ZIP="$(find . -maxdepth 4 -type f -iname 'Auriga_Source*.zip' -print -quit)"
          fi

          if [[ -z "$ZIP" ]]; then
            echo "Could not find an Auriga_Source ZIP in the repository."
            exit 1
          fi

          DEST="$RUNNER_TEMP/auriga-project"
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"

          SETTINGS_FILE="$(find "$DEST" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "Could not find settings.gradle(.kts) inside $ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: auriga-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
